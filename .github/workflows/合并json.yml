name: 合并json

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '请输入需要合并的 JSON 链接（空格分隔）'
        required: true
        default: ''
      filename:
        description: '请输入生成的文件名（不需要加 .json 后缀）'
        required: true
        default: 'merged_domains'

jobs:
  merge_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Merge Script
        shell: python
        run: |
          import json
          import requests
          import os

          # 1. 获取输入参数
          urls_str = "${{ github.event.inputs.urls }}"
          custom_filename = "${{ github.event.inputs.filename }}"
          urls = urls_str.split()
          
          final_rules = []
          version = 2

          # 2. 拉取并解析所有链接
          for url in urls:
              print(f"正在下载并解析: {url}")
              try:
                  res = requests.get(url.strip(), timeout=30)
                  res.raise_for_status()
                  data = res.json()
                  if 'version' in data:
                      version = data['version']
                  if 'rules' in data:
                      final_rules.extend(data['rules'])
              except Exception as e:
                  print(f"处理 {url} 时出错: {e}")

          # 3. 智能去重合并逻辑
          # 按字段组合归类合并，确保 domain/ip_cidr 等各自去重
          merged_data = {}
          for rule in final_rules:
              # 提取所有列表类型的键作为标识符
              list_keys = tuple(sorted([k for k, v in rule.items() if isinstance(v, list)]))
              if not list_keys: continue 
              
              if list_keys not in merged_data:
                  merged_data[list_keys] = {k: set() for k in list_keys}
                  # 保留非列表字段 (例如 tag, action)
                  for k, v in rule.items():
                      if not isinstance(v, list):
                          merged_data[list_keys][k] = v
              
              for k in list_keys:
                  merged_data[list_keys][k].update(rule.get(k, []))

          # 4. 转换回标准 JSON 格式
          processed_rules = []
          for keys, content in merged_data.items():
              new_rule = {}
              for k, v in content.items():
                  new_rule[k] = sorted(list(v)) if isinstance(v, set) else v
              processed_rules.append(new_rule)

          result = {"version": version, "rules": processed_rules}

          # 5. 目录处理：如果没有 123 目录就创建
          output_dir = "123"
          if not os.path.exists(output_dir):
              print(f"目录 {output_dir} 不存在，正在创建...")
              os.makedirs(output_dir)
          
          # 处理文件名后缀
          file_name = custom_filename if custom_filename.endswith(".json") else f"{custom_filename}.json"
          output_path = os.path.join(output_dir, file_name)

          # 6. 保存文件
          with open(output_path, "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2, ensure_ascii=False)
          
          print(f"成功合并！文件已保存至: {output_path}")

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 确保将新创建的目录和文件都加入暂存区
          git add 123/
          git commit -m "Merge JSON to ${{ github.event.inputs.filename }}.json" || echo "No changes to commit"
          git push origin main
