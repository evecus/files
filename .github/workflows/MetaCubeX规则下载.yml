name: MetaCubeX规则下载

on:
  schedule:
    # 每天凌晨 0:00 (UTC) 运行一次
    - cron: '40 1 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          path: dest

      - name: Clone source repo (meta branch)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/MetaCubeX/meta-rules-dat.git -b meta source-meta
          cd source-meta
          git sparse-checkout set geo/geosite geo/geoip

      - name: Clone source repo (sing branch)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/MetaCubeX/meta-rules-dat.git -b sing source-sing
          cd source-sing
          git sparse-checkout set geo/geosite geo/geoip

      - name: Organize and Copy Files
        run: |
          # 创建目标目录结构
          mkdir -p dest/MetaCubeX/mihomo/geosite
          mkdir -p dest/MetaCubeX/mihomo/geoip
          mkdir -p dest/MetaCubeX/sing-box/geosite
          mkdir -p dest/MetaCubeX/sing-box/geoip

          # 1. 处理 Meta 分支 (.yaml 和 .mrs) -> mihomo 目录
          find source-meta/geo/geosite -maxdepth 1 -type f \( -name "*.yaml" -o -name "*.mrs" \) -exec cp {} dest/MetaCubeX/mihomo/geosite/ \;
          find source-meta/geo/geoip -maxdepth 1 -type f \( -name "*.yaml" -o -name "*.mrs" \) -exec cp {} dest/MetaCubeX/mihomo/geoip/ \;

          # 2. 处理 Sing 分支 (.json 和 .srs) -> sing-box 目录
          find source-sing/geo/geosite -maxdepth 1 -type f \( -name "*.json" -o -name "*.srs" \) -exec cp {} dest/MetaCubeX/sing-box/geosite/ \;
          find source-sing/geo/geoip -maxdepth 1 -type f \( -name "*.json" -o -name "*.srs" \) -exec cp {} dest/MetaCubeX/sing-box/geoip/ \;

      - name: Commit and Push
        run: |
          cd dest
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          # 检查是否有文件变化
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update GeoData: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes detected, skipping push."
          fi
