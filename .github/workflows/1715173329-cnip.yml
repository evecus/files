name: 中国 IP 规则转换 (彻底修复 404 及格式错误)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  convert-cnip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Cache Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/sing-box
            /usr/local/bin/mihomo
          key: ${{ runner.os }}-tools-v1

      - name: Install Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/SagerNet/sing-box/releases/download/v1.12.17/sing-box-1.12.17-linux-amd64.tar.gz
          tar -xzf sing-box-1.12.17-linux-amd64.tar.gz
          sudo mv sing-box-1.12.17-linux-amd64/sing-box /usr/local/bin/
          
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.19.17/mihomo-linux-amd64-v1.19.17.gz
          gunzip mihomo-linux-amd64-v1.19.17.gz
          chmod +x mihomo-linux-amd64-v1.19.17
          sudo mv mihomo-linux-amd64-v1.19.17 /usr/local/bin/mihomo

      - name: 1. 下载并多重校验转换 IP 规则
        run: |
          set -euo pipefail
          
          SB_DIR="1715173329/cnip/sing-box"
          MH_DIR="1715173329/cnip/mihomo"
          mkdir -p "$SB_DIR" "$MH_DIR"
          mkdir -p temp_ip
          
          FILES=("ip" "ip4" "ip6")
          # 修复点 1：更换为 main 分支，并使用通用的 raw 链接
          BASE_URL="https://raw.githubusercontent.com/1715173329/IPCIDR-CHINA/main"
          
          for file in "${FILES[@]}"; do
            echo "------------------------------------------------"
            echo "正在处理: $file.txt"
            
            # 修复点 2：使用 -f 参数，若遇到 404 直接让 curl 报错，配合 retry 增加稳定性
            if ! curl -fL "$BASE_URL/$file.txt" -o "temp_ip/$file.txt"; then
              echo "错误: $file.txt 下载失败 (可能是分支名变更或文件不存在)，跳过。"
              continue
            fi

            # 修复点 3：过滤非 IP 格式的行，确保只有包含数字和点的行进入处理流程
            grep -E '^[0-9a-fA-F:./]+$' "temp_ip/$file.txt" > "temp_ip/${file}_clean.txt" || true
            
            if [ ! -s "temp_ip/${file}_clean.txt" ]; then
              echo "警告: $file 提取后为空，跳过内容处理。"
              continue
            fi

            # B. 生成 Sing-box JSON
            jq -n --rawfile ips "temp_ip/${file}_clean.txt" \
              '{
                version: 1,
                rules: [
                  {
                    ip_cidr: ($ips | split("\n") | map(select(length > 0)))
                  }
                ]
              }' > "$SB_DIR/$file.json"
            
            # C. 编译为 Sing-box SRS
            sing-box rule-set compile --output "$SB_DIR/$file.srs" "$SB_DIR/$file.json"
            
            # D. 生成 Mihomo YAML
            echo "payload:" > "$MH_DIR/$file.yaml"
            sed 's/^/  - /' "temp_ip/${file}_clean.txt" >> "$MH_DIR/$file.yaml"
            
            # E. 编译为 Mihomo MRS
            mihomo convert-ruleset ipcidr yaml "$MH_DIR/$file.yaml" "$MH_DIR/$file.mrs"
            
            echo "成功完成: $file"
          done

      - name: Commit and Push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add 1715173329/cnip/
          git commit -m "Fix: handled 404 and branch name change for CN IP rules" || echo "No changes"
          git push origin main
