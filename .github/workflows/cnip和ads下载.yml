name: cnip和ads下载

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare directory
        run: |
          mkdir -p mihomo-rules

      # ===== CN IP rules =====
      - name: Download cn.yaml
        run: |
          curl -L \
            https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.yaml \
            -o mihomo-rules/cn_ip.yaml

      - name: Download cn.mrs
        run: |
          curl -L \
            https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs \
            -o mihomo-rules/cn_ip.mrs

      # ===== Ads rules =====
      - name: Download ads.yaml
        run: |
          curl -L \
            https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.yaml \
            -o mihomo-rules/ads.yaml

      - name: Download ads.mrs
        run: |
          curl -L \
            https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs \
            -o mihomo-rules/ads.mrs

      # ===== Commit =====
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            mihomo-rules/cn_ip.yaml \
            mihomo-rules/cn_ip.mrs \
            mihomo-rules/ads.yaml \
            mihomo-rules/ads.mrs

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update CN IP & Ads rules"
            git push
          fi
