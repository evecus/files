name: Build Pure China Domains Only
on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        run: |
          echo "RELEASE_NAME=China_Only_$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d)" >> $GITHUB_ENV
          # 只保留这三个最核心的国内加速源
          echo "CHINA_DOMAINS_URL=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/accelerated-domains.china.conf" >> $GITHUB_ENV
          echo "GOOGLE_DOMAINS_URL=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/google.china.conf" >> $GITHUB_ENV
          echo "APPLE_DOMAINS_URL=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/apple.china.conf" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Process Domains
        run: |
          # 1. 提取域名并去除前缀后缀
          curl -sSL $CHINA_DOMAINS_URL | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' > china.txt
          curl -sSL $GOOGLE_DOMAINS_URL | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' > google.txt
          curl -sSL $APPLE_DOMAINS_URL | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' > apple.txt
          
          # 2. 合并并去重 (生成约 2.5万 - 3万条)
          cat china.txt google.txt apple.txt | sort -u > final-cn-list.txt
          
          # 3. 准备 V2Ray geosite 格式的数据目录
          mkdir -p ./data/
          while read -r line; do
            echo "domain:$line" >> ./data/cn
          done < final-cn-list.txt

      - name: Build geosite.dat
        run: |
          # 下载并安装官方构建工具
          go install github.com/v2fly/domain-list-community@latest
          $(go env GOPATH)/bin/domain-list-community -datapath ./data/

      - name: Prepare Assets
        run: |
          mkdir -p ./publish/
          cp geosite.dat ./publish/
          cp final-cn-list.txt ./publish/china-list.txt
          cd ./publish && sha256sum geosite.dat > geosite.dat.sha256sum

      - name: Release and Push
        run: |
          cd publish || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release
