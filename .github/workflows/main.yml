name: Build Pure China Domains TXT
on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        run: |
          echo "RELEASE_NAME=China_List_$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d)" >> $GITHUB_ENV
          # 核心源：只使用 dnsmasq-china-list 的三个基础库
          echo "CHINA_DOMAINS_URL=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/accelerated-domains.china.conf" >> $GITHUB_ENV
          echo "GOOGLE_DOMAINS_URL=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/google.china.conf" >> $GITHUB_ENV
          echo "APPLE_DOMAINS_URL=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/apple.china.conf" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate China List
        run: |
          # 1. 下载并提取域名（去掉 dnsmasq 的 server=/.../ 格式，只保留域名）
          curl -sSL $CHINA_DOMAINS_URL | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' > raw-cn.txt
          curl -sSL $GOOGLE_DOMAINS_URL | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' > raw-google.txt
          curl -sSL $APPLE_DOMAINS_URL | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' > raw-apple.txt
          
          # 2. 合并、去重、排序
          cat raw-cn.txt raw-google.txt raw-apple.txt | sort -u > china-list.txt
          
          # 3. 统计数量（可选，方便在日志里查看是否符合 3-5 万条）
          echo "Total domains: $(wc -l < china-list.txt)"

      - name: Prepare Assets
        run: |
          mkdir -p ./publish/
          cp china-list.txt ./publish/
          cd ./publish && sha256sum china-list.txt > china-list.txt.sha256sum

      - name: Release and Push
        run: |
          cd publish || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release
