name: 合并去重并分类生成 MRS 规则

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Clone meta-rules-dat
        run: |
          git clone --depth=1 -b meta https://github.com/MetaCubeX/meta-rules-dat.git meta

      - name: Install Mihomo
        run: |
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.19.17/mihomo-linux-amd64-v1.19.17.gz
          gunzip mihomo-linux-amd64-v1.19.17.gz
          mv mihomo-linux-amd64-v1.19.17 mihomo
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

      - name: Merge and Deduplicate Rules
        run: |
          set -euo pipefail
          mkdir -p mihomo-rules
          
          # --- 工具函数：提取并统一清理域名 ---
          process_raw_domains() {
            sed -E '
              /^[[:space:]]*payload:/d;
              /^[[:space:]]*$/d;
              /^[[:space:]]*-[[:space:]]*DOMAIN-REGEX,/d;
              s/^[[:space:]]*-[[:space:]]*DOMAIN-SUFFIX,([^\r\n]+)/+.\1/;
              s/^[[:space:]]*-[[:space:]]*DOMAIN,([^\r\n]+)/\1/;
              s/^[[:space:]]*-[[:space:]]*//;
              s/[[:space:]]//g;
            '
          }

          # --- 核心写出函数：区分 +. 格式与普通格式 ---
          write_final_yaml() {
            local tmp_in="$1"
            local final_out="$2"
            local exclude_list="$3"
            
            # 基础去重
            sort -u "$tmp_in" > "${tmp_in}.sorted"
            
            # 优先级去重 (排除已处理过的域名)
            if [ -f "$exclude_list" ]; then
              comm -23 "${tmp_in}.sorted" "$exclude_list" > "${tmp_in}.final"
            else
              cp "${tmp_in}.sorted" "${tmp_in}.final"
            fi

            echo "payload:" > "$final_out"
            
            # 1. 提取带 +. 的 (后缀匹配) 并放在一起
            grep '^\+\.' "${tmp_in}.final" | sed 's/^/  - /' >> "$final_out" || true
            
            # 2. 提取不带 +. 的 (普通域名) 并放在一起
            grep -v '^\+\.' "${tmp_in}.final" | sed 's/^/  - /' >> "$final_out" || true
            
            # 更新全局已处理列表
            cat "${tmp_in}.final" >> all_processed.txt
            sort -u all_processed.txt -o all_processed.txt
          }

          # 初始化
          CN_TMP=cn_tmp.txt
          ADS_TMP=ads_tmp.txt
          FOREIGN_TMP=foreign_tmp.txt
          touch all_processed.txt

          EXACT_FOREIGN=(
            gfw.yaml google.yaml google-gemini.yaml youtube.yaml tiktok.yaml onedrive.yaml github.yaml
            telegram.yaml facebook.yaml twitter.yaml meta.yaml instagram.yaml paypal.yaml
            reddit.yaml netflix.yaml discord.yaml steam.yaml openai.yaml anthropic.yaml
          )

          is_exact_foreign() {
            local f="$1"
            for e in "${EXACT_FOREIGN[@]}"; do [[ "$f" == "$e" ]] && return 0; done
            return 1
          }

          # 1. 处理 ADS
          find meta/geo/geosite -name '*.yaml' | while read f; do
            [[ "$(basename "$f")" =~ (^|[-_])ads([.-]|$) ]] && process_raw_domains < "$f" >> "$ADS_TMP"
          done
          write_final_yaml "$ADS_TMP" "mihomo-rules/ads_domain.yaml" "none"

          # 2. 处理 FOREIGN
          find meta/geo/geosite -name '*.yaml' | while read f; do
            name=$(basename "$f")
            if [[ "$name" =~ '!cn' ]] && [[ ! "$name" =~ 'ads' ]]; then
              process_raw_domains < "$f" >> "$FOREIGN_TMP"
            elif is_exact_foreign "$name"; then
              process_raw_domains < "$f" >> "$FOREIGN_TMP"
            fi
          done
          write_final_yaml "$FOREIGN_TMP" "mihomo-rules/foreign_domain.yaml" "all_processed.txt"

          # 3. 处理 CN
          find meta/geo/geosite -name '*.yaml' | while read f; do
            name=$(basename "$f")
            [[ "$name" =~ (^|[-_])cn([.-]|$) ]] && [[ ! "$name" =~ '!cn' ]] && process_raw_domains < "$f" >> "$CN_TMP"
          done
          write_final_yaml "$CN_TMP" "mihomo-rules/cn_domain.yaml" "all_processed.txt"

      - name: Convert YAML to MRS
        run: |
          find mihomo-rules -type f -name "*.yaml" | while read FILE; do
            mihomo convert-ruleset domain yaml "$FILE" "${FILE%.*}.mrs"
          done

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "action@github.com"
          git add mihomo-rules/*.yaml mihomo-rules/*.mrs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update rules: Sorted by type (+. vs domain) and Deduplicated"
            git push
          fi
