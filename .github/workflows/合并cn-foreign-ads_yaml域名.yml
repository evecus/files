name: 合并cn-foreign-ads_yaml域名

on:
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Clone meta-rules-dat
        run: |
          git clone --depth=1 -b meta https://github.com/MetaCubeX/meta-rules-dat.git meta

      - name: Install Mihomo
        run: |
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.19.17/mihomo-linux-amd64-v1.19.17.gz
          gunzip mihomo-linux-amd64-v1.19.17.gz
          mv mihomo-linux-amd64-v1.19.17 mihomo
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

      - name: Generate, Deduplicate and Categorize Rules
        run: |
          set -euo pipefail
          
          # 1. 准备工作：创建输出目录（如果不存在），但绝对不删除它
          mkdir -p mihomo-rules
          # 创建临时工作目录，避免干扰现有文件
          mkdir -p temp_build
          
          # --- 域名清洗函数 ---
          process_raw_domains() {
            sed -E '
              /^[[:space:]]*payload:/d;
              /^[[:space:]]*$/d;
              /^[[:space:]]*-[[:space:]]*DOMAIN-REGEX,/d;
              s/^[[:space:]]*-[[:space:]]*DOMAIN-SUFFIX,([^\r\n]+)/+.\1/;
              s/^[[:space:]]*-[[:space:]]*DOMAIN,([^\r\n]+)/\1/;
              s/^[[:space:]]*-[[:space:]]*//;
              s/[[:space:]]//g;
            '
          }

          # --- YAML 写出函数 (仅在 temp_build 中操作) ---
          write_final_yaml() {
            local tmp_in="$1"
            local final_out="temp_build/$2"
            local exclude_list="$3"
            
            if [ ! -s "$tmp_in" ]; then
              echo "payload: []" > "$final_out"
              return 0
            fi

            sort -u "$tmp_in" > "${tmp_in}.sorted"
            
            if [ -f "$exclude_list" ] && [ -s "$exclude_list" ]; then
              sort -u "$exclude_list" -o "$exclude_list"
              comm -23 "${tmp_in}.sorted" "$exclude_list" > "${tmp_in}.final" || true
            else
              cp "${tmp_in}.sorted" "${tmp_in}.final"
            fi

            echo "payload:" > "$final_out"
            # 分类：+. 在前
            grep '^\+\.' "${tmp_in}.final" | sed 's/^/  - /' >> "$final_out" || true
            # 分类：普通域名在后
            grep -v '^\+\.' "${tmp_in}.final" | sed 's/^/  - /' >> "$final_out" || true
            
            cat "${tmp_in}.final" >> all_processed_domains.txt
            sort -u all_processed_domains.txt -o all_processed_domains.txt
          }

          # --- 初始化缓冲区 ---
          touch all_processed_domains.txt
          ADS_RAW="ads_raw.txt"; FOREIGN_RAW="foreign_raw.txt"; CN_RAW="cn_raw.txt"
          touch "$ADS_RAW" "$FOREIGN_RAW" "$CN_RAW"

          EXACT_FOREIGN=(
            gfw.yaml google.yaml google-gemini.yaml youtube.yaml tiktok.yaml onedrive.yaml github.yaml
            telegram.yaml facebook.yaml twitter.yaml meta.yaml instagram.yaml paypal.yaml
            reddit.yaml netflix.yaml discord.yaml steam.yaml steamcommunity.yaml steampowered.yaml
            epic.yaml epicgames.yaml origin.yaml ea.yaml uplay.yaml ubisoft.yaml battlenet.yaml
            blizzard.yaml rockstar.yaml psn.yaml xbox.yaml openai.yaml anthropic.yaml
            huggingface.yaml perplexity.yaml
          )

          is_exact_foreign() {
            local f="$1"
            for e in "${EXACT_FOREIGN[@]}"; do [[ "$f" == "$e" ]] && return 0; done
            return 1
          }

          # --- 执行合并 ---
          find meta/geo/geosite -name '*.yaml' | while read f; do
            base=$(basename "$f")
            [[ "$base" =~ (^|[-_])ads([.-]|$) ]] && process_raw_domains < "$f" >> "$ADS_RAW" || true
          done
          write_final_yaml "$ADS_RAW" "ads_domain.yaml" "none"

          find meta/geo/geosite -name '*.yaml' | while read f; do
            name=$(basename "$f")
            if [[ "$name" =~ '!cn' ]] && [[ ! "$name" =~ 'ads' ]]; then
              process_raw_domains < "$f" >> "$FOREIGN_RAW" || true
            elif is_exact_foreign "$name"; then
              process_raw_domains < "$f" >> "$FOREIGN_RAW" || true
            fi
          done
          write_final_yaml "$FOREIGN_RAW" "foreign_domain.yaml" "all_processed_domains.txt"

          find meta/geo/geosite -name '*.yaml' | while read f; do
            name=$(basename "$f")
            [[ "$name" =~ (^|[-_])cn([.-]|$) ]] && [[ ! "$name" =~ '!cn' ]] && process_raw_domains < "$f" >> "$CN_RAW" || true
          done
          write_final_yaml "$CN_RAW" "cn_domain.yaml" "all_processed_domains.txt"

      - name: Compile to MRS and Copy to mihomo-rules
        run: |
          # 1. 将临时生成的 YAML 转化为 MRS
          for name in ads_domain foreign_domain cn_domain; do
            YAML="temp_build/$name.yaml"
            MRS="temp_build/$name.mrs"
            if [ -f "$YAML" ]; then
              echo "Compiling $YAML..."
              mihomo convert-ruleset domain yaml "$YAML" "$MRS"
              
              # 2. 精准复制这 6 个文件到目标目录进行覆盖
              cp "$YAML" "mihomo-rules/$name.yaml"
              cp "$MRS" "mihomo-rules/$name.mrs"
            fi
          done

      - name: Commit and Push (Preserving other files)
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          
          # 只添加这 6 个特定文件，不 touch 其他文件
          git add mihomo-rules/ads_domain.yaml mihomo-rules/ads_domain.mrs \
                  mihomo-rules/foreign_domain.yaml mihomo-rules/foreign_domain.mrs \
                  mihomo-rules/cn_domain.yaml mihomo-rules/cn_domain.mrs

          if git diff --cached --quiet; then
            echo "No changes in merged rules."
          else
            git commit -m "Update rules: Precision overwrite 6 files, preserving others"
            git push
          fi
