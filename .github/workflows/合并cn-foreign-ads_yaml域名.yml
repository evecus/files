name: 合并去重并生成 MRS 规则 (精确转换版)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Clone meta-rules-dat
        run: |
          git clone --depth=1 -b meta https://github.com/MetaCubeX/meta-rules-dat.git meta

      - name: Install Mihomo
        run: |
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.19.17/mihomo-linux-amd64-v1.19.17.gz
          gunzip mihomo-linux-amd64-v1.19.17.gz
          mv mihomo-linux-amd64-v1.19.17 mihomo
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

      - name: Merge, Deduplicate and Categorize Rules
        run: |
          set -euo pipefail
          mkdir -p mihomo-rules
          
          # --- 1. 核心域名清洗函数 ---
          process_raw_domains() {
            sed -E '
              /^[[:space:]]*payload:/d;
              /^[[:space:]]*$/d;
              /^[[:space:]]*-[[:space:]]*DOMAIN-REGEX,/d;
              s/^[[:space:]]*-[[:space:]]*DOMAIN-SUFFIX,([^\r\n]+)/+.\1/;
              s/^[[:space:]]*-[[:space:]]*DOMAIN,([^\r\n]+)/\1/;
              s/^[[:space:]]*-[[:space:]]*//;
              s/[[:space:]]//g;
            '
          }

          # --- 2. 核心写出与分类函数 ---
          write_final_yaml() {
            local tmp_in="$1"
            local final_out="$2"
            local exclude_list="$3"
            
            if [ ! -s "$tmp_in" ]; then
              echo "payload: []" > "$final_out"
              return 0
            fi

            sort -u "$tmp_in" > "${tmp_in}.sorted"
            
            if [ -f "$exclude_list" ] && [ -s "$exclude_list" ]; then
              sort -u "$exclude_list" -o "$exclude_list"
              comm -23 "${tmp_in}.sorted" "$exclude_list" > "${tmp_in}.final" || true
            else
              cp "${tmp_in}.sorted" "${tmp_in}.final"
            fi

            echo "payload:" > "$final_out"
            
            # 分类 1: 后缀域名 (+.)
            if grep -q '^\+\.' "${tmp_in}.final"; then
              grep '^\+\.' "${tmp_in}.final" | sed 's/^/  - /' >> "$final_out"
            fi
            
            # 分类 2: 普通域名 (不含 +.)
            if grep -qv '^\+\.' "${tmp_in}.final"; then
              grep -v '^\+\.' "${tmp_in}.final" | sed 's/^/  - /' >> "$final_out"
            fi
            
            cat "${tmp_in}.final" >> all_processed_domains.txt
            sort -u all_processed_domains.txt -o all_processed_domains.txt
          }

          # --- 3. 初始化变量 ---
          touch all_processed_domains.txt
          ADS_TMP="ads_raw.txt"; FOREIGN_TMP="foreign_raw.txt"; CN_TMP="cn_raw.txt"
          touch "$ADS_TMP" "$FOREIGN_TMP" "$CN_TMP"

          EXACT_FOREIGN=(
            gfw.yaml google.yaml google-gemini.yaml youtube.yaml tiktok.yaml onedrive.yaml github.yaml
            telegram.yaml facebook.yaml twitter.yaml meta.yaml instagram.yaml paypal.yaml
            reddit.yaml netflix.yaml discord.yaml steam.yaml steamcommunity.yaml steampowered.yaml
            epic.yaml epicgames.yaml origin.yaml ea.yaml uplay.yaml ubisoft.yaml battlenet.yaml
            blizzard.yaml rockstar.yaml psn.yaml xbox.yaml openai.yaml anthropic.yaml
            huggingface.yaml perplexity.yaml
          )

          is_exact_foreign() {
            local f="$1"
            for e in "${EXACT_FOREIGN[@]}"; do [[ "$f" == "$e" ]] && return 0; done
            return 1
          }

          # --- 4. 分步骤合并 ---
          echo "Merging ADS..."
          find meta/geo/geosite -name '*.yaml' | while read f; do
            [[ "$(basename "$f")" =~ (^|[-_])ads([.-]|$) ]] && process_raw_domains < "$f" >> "$ADS_TMP" || true
          done
          write_final_yaml "$ADS_TMP" "mihomo-rules/ads_domain.yaml" "none"

          echo "Merging FOREIGN..."
          find meta/geo/geosite -name '*.yaml' | while read f; do
            name=$(basename "$f")
            if [[ "$name" =~ '!cn' ]] && [[ ! "$name" =~ 'ads' ]]; then
              process_raw_domains < "$f" >> "$FOREIGN_TMP" || true
            elif is_exact_foreign "$name"; then
              process_raw_domains < "$f" >> "$FOREIGN_TMP" || true
            fi
          done
          write_final_yaml "$FOREIGN_TMP" "mihomo-rules/foreign_domain.yaml" "all_processed_domains.txt"

          echo "Merging CN..."
          find meta/geo/geosite -name '*.yaml' | while read f; do
            name=$(basename "$f")
            [[ "$name" =~ (^|[-_])cn([.-]|$) ]] && [[ ! "$name" =~ '!cn' ]] && process_raw_domains < "$f" >> "$CN_TMP" || true
          done
          write_final_yaml "$CN_TMP" "mihomo-rules/cn_domain.yaml" "all_processed_domains.txt"

      - name: Convert specific YAML to MRS
        run: |
          # 明确指定转换这三个合成后的文件
          TARGETS=("ads_domain.yaml" "foreign_domain.yaml" "cn_domain.yaml")
          
          for FILE_NAME in "${TARGETS[@]}"; do
            FILE_PATH="mihomo-rules/$FILE_NAME"
            if [ -f "$FILE_PATH" ]; then
              OUTPUT_PATH="${FILE_PATH%.*}.mrs"
              echo "Compiling $FILE_PATH to $OUTPUT_PATH"
              mihomo convert-ruleset domain yaml "$FILE_PATH" "$OUTPUT_PATH"
            fi
          done

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          git add mihomo-rules/ads_domain.* mihomo-rules/foreign_domain.* mihomo-rules/cn_domain.*
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update rules: Precision compilation for ads, foreign, and cn"
            git push
          fi
