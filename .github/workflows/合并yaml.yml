name: 合并yml

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '请输入需要合并的 YAML 链接（空格分隔）'
        required: true
        default: ''
      filename:
        description: '请输入生成的文件名（不需要加 .yaml 后缀）'
        required: true
        default: 'merged_rules'

jobs:
  merge_yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests PyYAML

      - name: Run YAML Merge Script
        shell: python
        run: |
          import json
          import requests
          import yaml
          import os

          # 1. 获取输入
          urls_str = "${{ github.event.inputs.urls }}"
          custom_filename = "${{ github.event.inputs.filename }}"
          urls = urls_str.split()
          
          all_payloads = set()

          # 2. 拉取并解析 YAML
          for url in urls:
              print(f"正在下载: {url}")
              try:
                  res = requests.get(url.strip(), timeout=30)
                  res.raise_for_status()
                  # 使用 safe_load 防止安全隐患
                  data = yaml.safe_load(res.text)
                  
                  # 提取 payload 列表
                  if data and 'payload' in data and isinstance(data['payload'], list):
                      all_payloads.update(data['payload'])
                  else:
                      print(f"跳过 {url}: 格式不符合要求（未找到 payload 列表）")
              except Exception as e:
                  print(f"解析 {url} 失败: {e}")

          # 3. 排序
          sorted_payload = sorted(list(all_payloads))

          # 4. 构建新的 YAML 结构
          result = {
              "payload": sorted_payload
          }

          # 5. 目录与文件名处理
          output_dir = "123"
          os.makedirs(output_dir, exist_ok=True)
          
          file_name = custom_filename if custom_filename.endswith(".yaml") or custom_filename.endswith(".yml") else f"{custom_filename}.yaml"
          output_path = os.path.join(output_dir, file_name)

          # 6. 写入文件 (不使用别名以保持整洁)
          with open(output_path, "w", encoding="utf-8") as f:
              yaml.dump(result, f, default_flow_style=False, allow_unicode=True, sort_keys=False)
          
          print(f"合并完成！总条数: {len(sorted_payload)}，保存至: {output_path}")

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add 123/
          git commit -m "Merge YAML: ${{ github.event.inputs.filename }}" || echo "No changes"
          git push origin main
