name: Build Sing Proxy Rules

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"      # 支持手动触发

jobs:
  build-proxy-rules:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout 仓库
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ 下载 Domain JSON
    - name: Download domain JSON files
      run: |
        mkdir -p singbox-rules/domain
        sites=(google github twitter tiktok facebook category-ai-!cn youtube instagram spotify discord whatsapp reddit paypal gfw geolocation-!cn)
        for site in "${sites[@]}"; do
          wget -q "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/${site}.json" -P singbox-rules/domain || true
        done

    # 3️⃣ 下载 IP JSON
    - name: Download IP JSON files
      run: |
        mkdir -p singbox-rules/ip
        sites=(google telegram twitter facebook)
        for site in "${sites[@]}"; do
          wget -q "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geoip/${site}.json" -P singbox-rules/ip || true
        done

    # 4️⃣ 下载 sing-box
    - name: Download sing-box
      run: |
        wget -q https://github.com/SagerNet/sing-box/releases/download/v1.12.17/sing-box-1.12.17-linux-amd64.tar.gz
        tar -xzf sing-box-1.12.17-linux-amd64.tar.gz

    # 5️⃣ 生成 proxy-domain.json
    - name: Generate proxy-domain.json
      run: |
        mkdir -p sing
        jq -s '
          def collect(k): [ .[].rules[]?[k][]? ] | unique | sort;
          {
            version: 2,
            rules: [
              (collect("domain_suffix") | if length>0 then {domain_suffix:.} else {} end)
              + (collect("domain") | if length>0 then {domain:.} else {} end)
            ]
          }
        ' singbox-rules/domain/*.json > sing/proxy-domain.json

    # 6️⃣ 编译 proxy-domain.srs
    - name: Compile proxy-domain.srs
      run: |
        ./sing-box-1.12.17-linux-amd64/sing-box rule-set compile \
          --output sing/proxy-domain.srs sing/proxy-domain.json

    # 7️⃣ 生成 proxy-ip.json
    - name: Generate proxy-ip.json
      run: |
        jq -s '
          def collect(k): [ .[].rules[]?[k][]? ] | unique | sort;
          {
            version: 2,
            rules: [
              collect("ip_cidr") | if length>0 then {ip_cidr:.} else {} end
            ]
          }
        ' singbox-rules/ip/*.json > sing/proxy-ip.json

    # 8️⃣ 编译 proxy-ip.srs
    - name: Compile proxy-ip.srs
      run: |
        ./sing-box-1.12.17-linux-amd64/sing-box rule-set compile \
          --output sing/proxy-ip.srs sing/proxy-ip.json

    # 9️⃣ 生成 README.md（动态列出实际合并文件 + 执行时间）
    - name: Generate README.md
      run: |
        mkdir -p sing
        TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")

        echo "# Proxy Rules" > sing/README.md
        echo "" >> sing/README.md
        echo "生成时间: $TIMESTAMP" >> sing/README.md
        echo "" >> sing/README.md

        echo "## Domain Rules" >> sing/README.md
        echo "来源 JSON 文件：" >> sing/README.md
        for f in singbox-rules/domain/*.json; do
          [ -f "$f" ] || continue
          echo "- $(basename "$f")" >> sing/README.md
        done

        echo "" >> sing/README.md
        echo "## IP Rules" >> sing/README.md
        echo "来源 JSON 文件：" >> sing/README.md
        for f in singbox-rules/ip/*.json; do
          [ -f "$f" ] || continue
          echo "- $(basename "$f")" >> sing/README.md
        done

    # 🔟 清理临时目录
    - name: Cleanup temp directories
      run: |
        rm -rf singbox-rules

    # 1️⃣1️⃣ 提交到仓库
    - name: Commit and push
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "GitHub Actions"

        git add sing/proxy-*.*
        git add sing/README.md
        git commit -m "Update proxy-domain, proxy-ip rules and README" || exit 0
        git push
