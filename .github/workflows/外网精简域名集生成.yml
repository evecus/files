name: 外网精简域名集生成

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  build-foreign-lite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          wget https://github.com/SagerNet/sing-box/releases/download/v1.12.17/sing-box-1.12.17-linux-amd64.tar.gz
          tar -xzf sing-box-1.12.17-linux-amd64.tar.gz
          mv sing-box-1.12.17-linux-amd64/sing-box /usr/local/bin/
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.19.17/mihomo-linux-amd64-v1.19.17.gz
          gunzip mihomo-linux-amd64-v1.19.17.gz
          mv mihomo-linux-amd64-v1.19.17 mihomo
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

      - name: 1. 下载并精准提取域名
        run: |
          set -euo pipefail
          mkdir -p temp_source temp_build singbox-rules mihomo-rules
          
          FILES=(
            "category-ai-!cn.yaml" "discord.yaml" "facebook.yaml" "github.yaml" 
            "google.yaml" "instagram.yaml" "paypal.yaml" "reddit.yaml" 
            "spotify.yaml" "tiktok.yaml" "twitter.yaml" "whatsapp.yaml" 
            "youtube.yaml" "geogle-gemini.yaml" "telegram.yaml"
          )
          
          BASE_URL="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite"
          
          echo "==== 开始精准处理以下文件 ===="
          for file in "${FILES[@]}"; do
            echo "正在处理: $file"
            curl -sL "$BASE_URL/$file" -o "temp_source/$file"
            
            # --- 核心修复逻辑 ---
            # 提取 domain_suffix: 匹配包含 +. 的行，但只保留 +. 之后到引号或行尾之间的纯域名内容
            # 1. sed 匹配带引号或不带引号的 +. 格式
            # 2. 移除所有前缀（空格、减号、加号、点、引号）
            grep -E '^\s*-\s*"?\+\.' "temp_source/$file" | sed -E 's/^[[:space:]]*- "?\+\.//; s/"$//; s/^\.*//' >> temp_build/raw_suffix.txt || true
            
            # 提取 domain: 排除包含 +. 的行，提取纯域名
            grep -E '^\s*-\s*[^+. ]' "temp_source/$file" | grep -v "payload:" | sed -E 's/^[[:space:]]*- "//; s/^[[:space:]]*- //; s/"$//' >> temp_build/raw_domain.txt || true
          done
          
          # 去重排序
          sort -u temp_build/raw_suffix.txt -o temp_build/all_suffix.txt
          sort -u temp_build/raw_domain.txt -o temp_build/all_domain.txt
          
          # 生成 Mihomo YAML (确保格式为 - +.domain.com)
          echo "payload:" > mihomo-rules/foreign_domain-lite.yaml
          sed 's/^/  - +./' temp_build/all_suffix.txt >> mihomo-rules/foreign_domain-lite.yaml
          sed 's/^/  - /' temp_build/all_domain.txt >> mihomo-rules/foreign_domain-lite.yaml
          
          echo "==== 合并完成 ===="

      - name: 2. 转换为 Sing-box JSON
        run: |
          set -euo pipefail
          # 使用 jq 生成干净的 JSON 数组，不再包含 "- +." 干扰符
          jq -n --rawfile suffix temp_build/all_suffix.txt --rawfile exact temp_build/all_domain.txt \
            '{
              version: 2,
              rules: [
                {
                  domain: ($exact | split("\n") | map(select(length > 0))),
                  domain_suffix: ($suffix | split("\n") | map(select(length > 0)))
                }
              ]
            }' > singbox-rules/foreign_domain-lite.json

      - name: 3. 编译二进制文件 (MRS & SRS)
        run: |
          mihomo convert-ruleset domain yaml mihomo-rules/foreign_domain-lite.yaml mihomo-rules/foreign_domain-lite.mrs
          sing-box rule-set compile --output singbox-rules/foreign_domain-lite.srs singbox-rules/foreign_domain-lite.json

      - name: Commit and Push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add singbox-rules/foreign_domain-lite.* mihomo-rules/foreign_domain-lite.*
          git commit -m "Fix: correct formatting for foreign_domain-lite" || echo "No changes"
          git push origin main
