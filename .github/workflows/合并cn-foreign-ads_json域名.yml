name: 合并cn-foreign-ads_json域名

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Checkout meta-rules-dat (sing branch)
        uses: actions/checkout@v4
        with:
          repository: MetaCubeX/meta-rules-dat
          ref: sing
          path: meta-rules-dat

      - name: Download sing-box
        run: |
          wget https://github.com/SagerNet/sing-box/releases/download/v1.12.17/sing-box-1.12.17-linux-amd64.tar.gz
          tar -xzf sing-box-1.12.17-linux-amd64.tar.gz
          mv sing-box-1.12.17-linux-amd64/sing-box /usr/local/bin/

      - name: Process Rules, Deduplicate and Categorize
        run: |
          set -euo pipefail
          SRC="meta-rules-dat/geo/geosite"
          OUT_DIR="singbox-rules"
          mkdir -p "$OUT_DIR"
          mkdir -p temp_build

          # --- 1. 核心构建函数：支持分类去重 ---
          build_json_ruleset() {
            local name="$1"
            local exclude_list="$2"
            shift 2
            local files=("$@")
            local final_out="singbox-rules/${name}.json"
            
            # 分别提取 domain 和 domain_suffix
            jq -r '.rules[].domain[]?' "${files[@]}" 2>/dev/null | sed 's/[[:space:]]//g; /^$/d' | sort -u > temp_exact.txt || touch temp_exact.txt
            jq -r '.rules[].domain_suffix[]?' "${files[@]}" 2>/dev/null | sed 's/[[:space:]]//g; /^$/d' | sort -u > temp_suffix.txt || touch temp_suffix.txt

            # 跨文件优先级去重 (排除之前类别已有的域名)
            if [ -f "$exclude_list" ] && [ -s "$exclude_list" ]; then
              comm -23 temp_exact.txt "$exclude_list" > temp_exact.tmp && mv temp_exact.tmp temp_exact.txt
              comm -23 temp_suffix.txt "$exclude_list" > temp_suffix.tmp && mv temp_suffix.tmp temp_suffix.txt
            fi

            # 内部逻辑去重：如果 domain_suffix 已包含该域名，则从 domain 中剔除
            comm -23 temp_exact.txt temp_suffix.txt > temp_exact_final.txt

            # 生成 JSON
            jq -n \
              --rawfile exact temp_exact_final.txt \
              --rawfile suffix temp_suffix.txt \
              '{
                version: 2,
                rules: [{
                  domain: ($exact | split("\n") | map(select(length > 0))),
                  domain_suffix: ($suffix | split("\n") | map(select(length > 0)))
                }]
              }' > "$final_out"

            # 记录到已处理列表（合并后缀和精确域名）
            cat temp_exact_final.txt temp_suffix.txt >> all_processed.txt
            sort -u all_processed.txt -o all_processed.txt
          }

          # --- 2. 初始化变量与白名单 ---
          touch all_processed.txt
          EXACT_LIST=(
            gfw.json google.json youtube.json tiktok.json onedrive.json github.json
            telegram.json facebook.json twitter.json meta.json instagram.json paypal.json
            reddit.json netflix.json discord.json google-gemini.json steam.json steamcommunity.json 
            steampowered.json epic.json epicgames.json openai.json anthropic.json huggingface.json perplexity.json
          )
          
          declare -A FILE_MAP
          while IFS= read -r f; do FILE_MAP["$(basename "$f")"]="$f"; done < <(find "$SRC" -type f -name "*.json")

          # --- 3. 开始合成 ---

          # A. ADS (最高优先级)
          mapfile -t ADS_FILES < <(find "$SRC" -type f -name "*.json" | grep -E '(^|[^a-zA-Z0-9])ads([^a-zA-Z0-9]|\.json$)')
          build_json_ruleset "ads_domain" "none" "${ADS_FILES[@]}"

          # B. FOREIGN (中优先级，排除 ADS)
          FOREIGN_FILES=()
          while IFS= read -r f; do FOREIGN_FILES+=("$f"); done < <(find "$SRC" -type f -name "*.json" | grep '!cn' | grep -Ev 'ads')
          for name in "${EXACT_LIST[@]}"; do [[ -n "${FILE_MAP[$name]:-}" ]] && FOREIGN_FILES+=("${FILE_MAP[$name]}"); done
          build_json_ruleset "foreign_domain" "all_processed.txt" "${FOREIGN_FILES[@]}"

          # C. CN (低优先级，排除 ADS 和 FOREIGN)
          mapfile -t CN_FILES < <(find "$SRC" -type f -name "*.json" | grep -Ev '!cn' | grep -E '(^|[^a-zA-Z0-9])cn([^a-zA-Z0-9]|\.json$)')
          build_json_ruleset "cn_domain" "all_processed.txt" "${CN_FILES[@]}"

      - name: Compile JSON to SRS
        run: |
          cd singbox-rules
          TARGETS=("ads_domain" "foreign_domain" "cn_domain")
          for name in "${TARGETS[@]}"; do
            if [ -f "${name}.json" ]; then
              echo "Compiling ${name}.json..."
              sing-box rule-set compile --output "${name}.srs" "${name}.json"
            fi
          done

      - name: Commit and Push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          # 精准添加 6 个文件
          git add singbox-rules/ads_domain.json singbox-rules/ads_domain.srs \
                  singbox-rules/foreign_domain.json singbox-rules/foreign_domain.srs \
                  singbox-rules/cn_domain.json singbox-rules/cn_domain.srs

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Sing-box Rules: 3 JSON & 3 SRS (Categorized & Deduplicated)"
            git push
          fi
