name: mihomo_ip_mrs文件生成

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build-mihomo-ip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Clone meta-rules-dat (meta branch)
        run: |
          git clone --depth=1 -b meta https://github.com/MetaCubeX/meta-rules-dat.git meta-source

      - name: Install Mihomo
        run: |
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.19.17/mihomo-linux-amd64-v1.19.17.gz
          gunzip mihomo-linux-amd64-v1.19.17.gz
          mv mihomo-linux-amd64-v1.19.17 mihomo
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

      - name: Process IP Rules (YAML Format)
        run: |
          set -euo pipefail
          SRC="meta-source/geo/geoip"
          OUT_DIR="mihomo-rules"
          mkdir -p "$OUT_DIR"
          
          # 定义源文件路径 (YAML 格式)
          FILES_FOREIGN=("$SRC/google.yaml" "$SRC/twitter.yaml" "$SRC/facebook.yaml" "$SRC/telegram.yaml")
          FILE_CN="$SRC/cn.yaml"

          # --- 工具函数：处理 IP 并生成 YAML ---
          # 参数 1: 输出文件名, 参数 2: 是否仅 v4 (true/false), 参数 3+: 输入文件
          generate_ip_yaml() {
            local out_name="$1"
            local v4_only="$2"
            shift 2
            local files=("$@")
            local target_file="$OUT_DIR/${out_name}.yaml"

            # 提取所有 IP 行 (去掉 payload: 和 - )
            grep -hE '^[[:space:]]*- ' "${files[@]}" | sed 's/[[:space:]]*- //g' | sort -u > raw_ips.txt

            # 分离 v4 和 v6
            grep "\." raw_ips.txt > v4.txt || touch v4.txt
            grep ":" raw_ips.txt > v6.txt || touch v6.txt

            echo "payload:" > "$target_file"
            if [ "$v4_only" = "true" ]; then
              sed 's/^/  - /' v4.txt >> "$target_file"
            else
              # IPv4 在前，IPv6 在后
              sed 's/^/  - /' v4.txt >> "$target_file"
              sed 's/^/  - /' v6.txt >> "$target_file"
            fi
            
            rm -f raw_ips.txt v4.txt v6.txt
          }

          # 1. 生成 Foreign IP 规则
          echo "Processing Foreign IPs..."
          generate_ip_yaml "foreign_ip4" "true" "${FILES_FOREIGN[@]}"
          generate_ip_yaml "foreign_ip" "false" "${FILES_FOREIGN[@]}"

          # 2. 生成 CN IP 规则 (仅 IPv4)
          echo "Processing CN IPs..."
          generate_ip_yaml "cn_ip4" "true" "$FILE_CN"

      - name: Compile YAML → MRS
        run: |
          cd mihomo-rules
          TARGETS=("foreign_ip4" "foreign_ip" "cn_ip4")
          for name in "${TARGETS[@]}"; do
            echo "Compiling ${name}.yaml to ${name}.mrs..."
            mihomo convert-ruleset ipcidr yaml "${name}.yaml" "${name}.mrs"
          done

      - name: Commit and Push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          # 精准添加生成的 6 个文件
          git add mihomo-rules/foreign_ip4.yaml mihomo-rules/foreign_ip4.mrs \
                  mihomo-rules/foreign_ip.yaml mihomo-rules/foreign_ip.mrs \
                  mihomo-rules/cn_ip4.yaml mihomo-rules/cn_ip4.mrs

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Mihomo IP Rules (YAML & MRS)"
            git push
          fi
