name: 精简版cn规则集生成

on:
  workflow_dispatch:
  schedule:
    - cron: "18 1 * * *"

permissions:
  contents: write

jobs:
  convert-lite-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          wget https://github.com/SagerNet/sing-box/releases/download/v1.12.17/sing-box-1.12.17-linux-amd64.tar.gz
          tar -xzf sing-box-1.12.17-linux-amd64.tar.gz
          mv sing-box-1.12.17-linux-amd64/sing-box /usr/local/bin/
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.19.17/mihomo-linux-amd64-v1.19.17.gz
          gunzip mihomo-linux-amd64-v1.19.17.gz
          mv mihomo-linux-amd64-v1.19.17 mihomo
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

      - name: 1. 处理 IP 规则
        run: |
          set -euo pipefail
          mkdir -p singbox-rules mihomo-rules temp_lite
          curl -L "https://fastly.jsdelivr.net/gh/1715173329/IPCIDR-CHINA@rule-set/cn.srs" -o temp_lite/cn_raw.srs
          sing-box rule-set decompile --output temp_lite/cn_ip-lite.json temp_lite/cn_raw.srs
          jq '.rules[0] |= {ip_cidr: [.ip_cidr[] | select(contains(":") | not)]}' temp_lite/cn_ip-lite.json > temp_lite/cn_ip4-lite.json

          for f in cn_ip-lite cn_ip4-lite; do
            echo "payload:" > "temp_lite/$f.yaml"
            jq -r '.rules[].ip_cidr[]?' "temp_lite/$f.json" | sed 's/^/  - /' >> "temp_lite/$f.yaml"
          done

      - name: 2. 处理域名规则 (修复 JSON/YAML 前导点)
        run: |
          set -euo pipefail
          curl -L "https://fastly.jsdelivr.net/gh/1715173329/sing-geosite@rule-set-unstable/geosite-geolocation-cn.srs" -o temp_lite/cn_dom_raw.srs
          sing-box rule-set decompile --output temp_lite/raw_dom.json temp_lite/cn_dom_raw.srs
          
          # 修复 JSON：使用 map(sub("^\\.+"; "")) 清除数组元素开头的点
          jq '{
            version: .version, 
            rules: [
              .rules[] | {
                domain: (.domain | map(sub("^\\.+"; ""))), 
                domain_suffix: (.domain_suffix | map(sub("^\\.+"; "")))
              } | del(..|nulls)
            ]
          }' temp_lite/raw_dom.json > temp_lite/cn_domain-lite.json
          
          echo "payload:" > temp_lite/cn_domain-lite.yaml
          
          # 修复 YAML：提取 domain_suffix -> - +.baidu.com (无双点)
          jq -r '.rules[].domain_suffix[]?' temp_lite/cn_domain-lite.json | sed 's/^\.*//; s/^/  - +./' >> temp_lite/cn_domain-lite.yaml || true
          
          # 修复 YAML：提取 domain -> - zs2.cnzz.com
          jq -r '.rules[].domain[]?' temp_lite/cn_domain-lite.json | sed 's/^\.*//; s/^/  - /' >> temp_lite/cn_domain-lite.yaml || true

      - name: 3. 编译并分发文件
        run: |
          for f in cn_ip-lite cn_ip4-lite cn_domain-lite; do
            sing-box rule-set compile --output "singbox-rules/$f.srs" "temp_lite/$f.json"
            cp "temp_lite/$f.json" "singbox-rules/$f.json"
            
            TYPE=$([[ "$f" == *"ip"* ]] && echo "ipcidr" || echo "domain")
            mihomo convert-ruleset "$TYPE" yaml "temp_lite/$f.yaml" "mihomo-rules/$f.mrs"
            cp "temp_lite/$f.yaml" "mihomo-rules/$f.yaml"
          done

      - name: Commit and Push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add singbox-rules/ mihomo-rules/
          git commit -m "Fix: correct cn_domain-lite JSON and YAML dot format" || echo "No changes"
          git push origin main
