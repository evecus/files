name: release

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  arm64:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is empty" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/keystore.jks"
          ls -la "${GITHUB_WORKSPACE}/keystore.jks"

      - name: Assemble Release APK
        env:
          STORE_FILE: ${{ github.workspace }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Move and rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/slim-live-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          files: out/*.apk